{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up • NEXUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full mx-auto px-6 py-12">
        <!-- Logo -->
        <div class="flex justify-center mb-10">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-yellow-400 rounded-3xl flex items-center justify-center text-black font-bold text-4xl">N</div>
                <h1 class="text-4xl font-semibold tracking-tighter heading-font">NEXUS</h1>
            </div>
        </div>

        <div class="bg-zinc-900 rounded-3xl p-10">
            <h2 class="text-3xl font-semibold heading-font text-center mb-8">Create Account</h2>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Username</label>
                        <input type="text" name="username" required
                               class="w-full bg-zinc-800 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-yellow-400 transition-colors"
                               placeholder="Choose a username">
                    </div>

                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Password</label>
                        <input type="password" name="password" required
                               class="w-full bg-zinc-800 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-yellow-400 transition-colors"
                               placeholder="Create password">
                    </div>

                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Confirm Password</label>
                        <input type="password" name="password2" required
                               class="w-full bg-zinc-800 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-yellow-400 transition-colors"
                               placeholder="Re-enter password">
                    </div>

                    <button type="submit"
                            class="w-full py-4 bg-yellow-400 text-black font-semibold rounded-3xl text-lg hover:bg-amber-300 transition-all mt-4">
                        Sign Up
                    </button>
                </div>
            </form>

            <div class="text-center mt-8">
                <p class="text-gray-400">
                    Already have an account? 
                    <a href="{% url 'login' %}" class="text-yellow-400 hover:underline font-medium">Login</a>
                </p>
            </div>
        </div>

        <p class="text-center text-gray-500 text-sm mt-8">
            © 2026 NEXUS Studio
        </p>
    </div>

</body>
</html>
